name: CI Pipeline - Restaurant Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload JUnit test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report-node-${{ matrix.node-version }}
          path: backend/junit.xml

  docker-build:
    name: Docker Build & Security Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t restaurant-backend:ci ./backend

      - name: Verify non-root user
        run: |
          USER_NAME=$(docker run --rm restaurant-backend:ci whoami)
          echo "Container user: $USER_NAME"
          if [ "$USER_NAME" != "node" ]; then
            echo "ERROR: Container is not running as non-root user 'node'"
            exit 1
          fi
